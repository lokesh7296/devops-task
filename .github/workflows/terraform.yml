name: Terraform

on:
  push:
    branches: [main]
    paths: ["terraform/*", "app/", ".github/workflows/*"]
  pull_request:
    paths: ["terraform/*", "app/*"]
  workflow_dispatch:
    inputs:
      action:
        description: "apply or destroy"
        required: true
        default: apply
        type: choice
        options: [apply, destroy]

permissions:
  contents: read

concurrency:
  group: terraform

env:
  AWS_REGION: ap-south-1

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        if: github.event.inputs.action != 'destroy'
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: terraform apply -input=false -auto-approve tfplan

      - name: Health check
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: |
          URL=$(terraform output -raw app_url)
          for i in $(seq 1 30); do
            code=$(curl -sk -o /dev/null -w "%{http_code}" "$URL/health.html" || true)
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1

      - name: Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve
